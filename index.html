<!DOCTYPE html>
<html lang="ru">
<head>
		  <meta charset="UTF-8">
		  <title>Страница</title>
		  <link href="styles.css"
				  rel="stylesheet">
</head>

<body class="body">
<header class="header">
		  <img src="assets/icons8-кошка-94.png"
				 class="header-logo"
				 alt="кошечка"/>
		  <nav
						class="header-nav">
					 <ul class="header-nav__list">
								<li class="active">О нас</li>
								<li>Услуги</li>
								<li>Контакты</li>
					 </ul>
		  </nav>
		  <div />
</header>
<div class="register">
		  <div class="register-form">
					 <h1 class="register-form__title">Войти</h1>
					 <div
								  class="register-form__item">
								<label for="email">email</label>
								<input id="email"
										 class="input"
										 type="email"
										 placeholder="Введите email"/>
					 </div>
					 <div
								  class="register-form__item">
								<label for="password">password</label>
								<input id="password"
										 class="input"
										 type="password"
										 placeholder="Введите password"/>
					 
					 </div>
					 <button class="register-form__submit">Отправить</button>
		  
		  </div>
</div>
</body>

</html>
