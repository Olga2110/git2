<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Первая странциа Ольги</title>
    <link rel="stylesheet" href="./styles.css">
</head>
    <body >
	 
	 <header class="header">
		<img src="./assets/headerIcon.png"
			  alt="header-icon"
			  class="header-icon"/>
				<nav class="header-nav">
						  <ul class="header-nav-list">
									 <li>
												Main
									 </li>
									 <li>
												Products
									 </li>
									 <li>
												Comments
									 </li>
						  </ul>
				</nav>
				
				<div class="header-actions">
						  <button class="header-actions__register">Зарегистрироваться</button>
						  <button class="header-actions__login">Войти</button>
				</div>
	 </header>
	 
     <div class="register">
         <div class="register-form">
             <h3>
                 Войти
            </h3>
             <div class="register-form__item">
                 <label for="email">Email</label>
                 <input class="input" id="email"  type="email" placeholder="Email">
             </div>
           <div class="register-form__item">
               <label for="password">Password</label>
               <input class="input" id="password" placeholder="Password">
           </div>
             <button class="register-form__submit">Войти</button>
         </div>
     </div>
    </body>
</html>
